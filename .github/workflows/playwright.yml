name: Playwright Tests
on:
  schedule:
    # Uruchamia testy codziennie o 3:00 w nocy (czasu UTC)
    - cron: '0 3 * * *'
  workflow_dispatch: # Pozwala na ręczne odpalenie testu przyciskiem na GitHubie

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./PWE_Testy
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test fatal_error.spec.js --project=chromium --workers=1
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: PWE_Testy/playwright-report/
        retention-days: 7
